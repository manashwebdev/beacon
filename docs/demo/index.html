<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beacon demo</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--accent:#7cf5d4;--ink:#eef6ff;--dim:rgba(238,246,255,.62);--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.15);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#05060d;color:var(--ink);font-family:Outfit,system-ui,sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 22s ease-in-out infinite alternate}
.bg i:nth-child(1){width:55vmax;height:55vmax;left:-12vmax;top:-18vmax;background:var(--accent)}
.bg i:nth-child(2){width:48vmax;height:48vmax;right:-14vmax;top:10vmax;background:#6a5cff;animation-delay:-7s}
.bg i:nth-child(3){width:40vmax;height:40vmax;left:20vmax;bottom:-20vmax;background:#ff5ca8;animation-delay:-13s;opacity:.32}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.18)}}
.glow{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.07),transparent 60%)}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.18)}
.lift{transition:transform .2s,box-shadow .25s}.lift:hover{transform:translateY(-3px);box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 34px color-mix(in srgb,var(--accent) 30%,transparent),inset 0 1px rgba(255,255,255,.2)}
#root{position:relative;z-index:2}
.nav{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));width:min(1100px,100% - 24px);margin:10px auto 0;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px;z-index:50}
.brand{font-weight:600;letter-spacing:.2em;text-shadow:0 0 16px var(--accent);cursor:pointer;background:none;border:0;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.wrap{width:min(1100px,100% - 32px);margin:0 auto;padding:30px 0 90px}
.demo{width:min(1100px,100% - 24px);margin:10px auto 0;padding:8px 14px;font-size:13px;color:var(--dim);text-align:center}
.h1{font-size:clamp(30px,5.5vw,58px);line-height:1.08;font-weight:300;margin:0;text-shadow:0 0 32px color-mix(in srgb,var(--accent) 55%,transparent)}
.h2{font-size:clamp(24px,4vw,36px);font-weight:300;margin:0 0 22px;text-shadow:0 0 28px color-mix(in srgb,var(--accent) 40%,transparent)}
.muted{color:var(--dim)}.err{color:#ff9aa9;font-size:14px;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
.btn{background:color-mix(in srgb,var(--accent) 22%,transparent);border:1px solid var(--accent);border-radius:12px;padding:8px 16px;cursor:pointer;font-size:14px;transition:box-shadow .2s,transform .15s}
.btn:hover{box-shadow:0 0 22px var(--accent);transform:translateY(-1px)}
.btn.g{background:transparent;border-color:var(--line)}.btn.g:hover{border-color:var(--accent)}.btn.g.on{border-color:var(--accent);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.d{border-color:#ff6b81;background:rgba(255,107,129,.15)}
.in{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:9px 12px;outline:0;font-size:14px}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
select.in{appearance:none}select.in option{background:#0b0d1a}
.btn:focus-visible,.vote:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.chip.planned{border-color:#a78bff;color:#cdbfff}.chip.progress{border-color:#ffd166;color:#ffe39a}.chip.shipped{border-color:#5ef2a0;color:#9dfac8}.chip.owner{border-color:var(--accent);color:var(--accent)}
.post{display:flex;gap:14px;padding:16px;margin-bottom:12px;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.vote{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:54px;padding:8px 6px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;transition:box-shadow .2s,border-color .2s,transform .15s}
.vote:active{transform:scale(.92)}.vote b{font-size:18px;font-weight:600}
.vote.on{border-color:var(--accent);box-shadow:0 0 20px color-mix(in srgb,var(--accent) 45%,transparent)}
.reply{margin-top:10px;padding:8px 12px;border-left:2px solid var(--accent);background:rgba(255,255,255,.04);border-radius:0 10px 10px 0;font-size:14px}
.cm{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}.cm p{margin:0 0 8px}
.lk{background:none;border:0;padding:0;margin-top:8px;cursor:pointer;font-size:13px;color:var(--dim)}
.grid{display:grid;gap:14px}.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.col{padding:10px;display:grid;gap:10px;align-content:start;min-height:120px}
.bar{background:linear-gradient(to top,var(--accent),rgba(255,255,255,.35));border-radius:6px 6px 0 0;box-shadow:0 0 14px color-mix(in srgb,var(--accent) 50%,transparent);min-height:2px;width:100%;animation:grow .7s ease both;transform-origin:bottom}
@keyframes grow{from{transform:scaleY(0)}}
code{display:block;padding:12px;border-radius:12px;background:rgba(0,0,0,.35);font-size:13px;overflow-x:auto;white-space:pre}
.hero{display:flex;gap:40px;align-items:center;flex-wrap:wrap;padding-top:50px}.sec{margin-top:90px}
details.faq{padding:16px 20px;margin-bottom:10px}details.faq summary{cursor:pointer;font-weight:600}
.auth{width:min(400px,100%);margin:50px auto 0;padding:26px;display:grid;gap:12px}
.meter{display:flex;gap:4px;margin-bottom:6px}.meter span{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12);transition:background .25s}
.meter span.s1{background:#ff6b81}.meter span.s2{background:#ffd166}.meter span.s3{background:#9dfac8}.meter span.s4{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.pwb{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--dim);cursor:pointer;font-size:13px;padding:4px 8px}
#wb{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:900;padding:12px 18px;border-radius:999px;background:rgba(10,12,24,.8);box-shadow:0 0 24px color-mix(in srgb,var(--accent) 45%,transparent)}
#wp{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom,0px));width:min(390px,calc(100vw - 36px));height:min(560px,calc(100vh - 120px));overflow:auto;padding:16px;z-index:900;display:none;background:rgba(8,10,20,.92);animation:in .25s}
#wp.show{display:block}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div><div class="glow"></div>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s),ST={open:'Under review',planned:'Planned',progress:'In progress',shipped:'Shipped'},D=864e5,RK={viewer:1,editor:2,admin:3,owner:4},RL={owner:'Owner',admin:'Admin',editor:'Editor',viewer:'Viewer'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'}),ge=(a,b)=>RK[a]>=RK[b];
let me='guest';try{me=localStorage.getItem('bv')||(()=>{const v=(crypto.randomUUID?crypto.randomUUID():'v'+Math.random());localStorage.setItem('bv',v);return v})()}catch(e){}
const H=async s=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('beacon:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'x'+btoa(unescape(encodeURIComponent(s)))}};
let n=0;const mk=(t,b,a,st,v,d,rep,sh)=>({id:'p'+(++n),title:t,body:b,author:a,status:st,voters:Array.from({length:v},(_,i)=>'s'+n+'_'+i),reply:rep||'',createdAt:Date.now()-d*D,shippedAt:sh?Date.now()-sh*D:null,comments:[]});
const seed=()=>[mk('Dark mode for the diff viewer','Long sessions hurt my eyes at night.','Aarav','progress',42,9,'Started this week. Landing soon.'),mk('Export the comparison as PDF','Handy for sharing with a recruiter.','Meera','planned',31,6),mk('Compare more than two resume versions','','Kabir','open',24,4),mk('Keyboard shortcuts','Jump between changes with J and K.','Isha','open',17,3),mk('Hindi language support','','Rohan','planned',15,12),mk('Highlight changed skills in colour','','Neha','shipped',38,20,'Live now. Thanks for the idea!',5),mk('Faster upload for large PDFs','','Dev','shipped',22,16,'',9),mk('Save comparison history','','Tara','open',9,1)];
const seedTeam=()=>[{id:'t1',name:'Priya Nair',email:'priya@demo.dev',role:'admin'},{id:'t2',name:'Sam Rao',email:'sam@demo.dev',role:'editor'},{id:'t3',name:'Lee Das',email:'lee@demo.dev',role:'viewer'}];
let S;try{S=JSON.parse(localStorage.getItem('bd2'))}catch(e){}if(!S||!S.posts)S={posts:seed(),users:[],session:null,team:seedTeam()};
const save=()=>{try{localStorage.setItem('bd2',JSON.stringify(S))}catch(e){}};
let view='home',tab='road',flt='all',openC=null,wOpen=false,as='owner',next='dash',F={},fails=0;
const user=()=>S.users.find(u=>u.email===S.session),sorted=()=>[...S.posts].sort((a,b)=>b.voters.length-a.voters.length||b.createdAt-a.createdAt);
const go=(v,x)=>{view=v;F=x||{};scrollTo(0,0)};
const strength=p=>{const s=(p.length>=8)+(p.length>=12)+(/[A-Za-z]/.test(p)&&/\d/.test(p))+(/[^A-Za-z0-9]/.test(p));return{s,l:['Too weak','Weak','Okay','Good','Strong'][s]}};

function boardHTML(emb){const list=sorted().filter(p=>flt==='all'||p.status===flt);
 return `<div class="grid" style="gap:16px"><div><h1 class="h1" ${emb?'style="font-size:26px"':''}>ResumeDiff</h1><p class="muted" style="margin:8px 0 0">Compare two resume versions and see what changed. Tell us what to build next.</p></div>
 <form data-f="post" class="glass" style="padding:16px;display:grid;gap:10px"><input class="in" name="t" placeholder="What should we build or fix?" required minlength="3" maxlength="120"><textarea class="in" name="b" rows="2" placeholder="Add details (optional)"></textarea><div class="row"><input class="in" name="a" style="flex:1;min-width:120px" placeholder="Your name (optional)"><button class="btn">Submit idea</button></div>${F.post?`<div class="muted" style="font-size:14px" role="status">${F.post}</div>`:''}</form>
 <div class="row">${['all','open','planned','progress','shipped'].map(s=>`<button class="btn g ${flt===s?'on':''}" data-a="flt" data-id="${s}">${s==='all'?'All':ST[s]}</button>`).join('')}</div>
 <div>${list.map(p=>`<div class="glass post"><button class="vote ${p.voters.includes(me)?'on':''}" data-a="vote" data-id="${p.id}" aria-label="Upvote ${esc(p.title)}"><span aria-hidden="true">▲</span><b>${p.voters.length}</b></button><div style="flex:1;min-width:0"><div class="row"><b style="font-size:17px">${esc(p.title)}</b><span class="chip ${p.status}">${ST[p.status]}</span></div>${p.body?`<p class="muted" style="margin:6px 0 0;font-size:14px">${esc(p.body)}</p>`:''}${p.reply?`<div class="reply">${esc(p.reply)}</div>`:''}<button class="lk" data-a="cm" data-id="${p.id}">${openC===p.id?'Hide comments':'Comments ('+p.comments.length+')'} · by ${esc(p.author)}</button>${openC===p.id?`<div class="cm">${p.comments.map(c=>`<p><b>${esc(c.a)}</b> <span class="muted">${esc(c.t)}</span></p>`).join('')}<form data-f="cm" data-id="${p.id}" class="row"><input class="in" name="t" style="flex:1;min-width:140px" placeholder="Add a comment" required><button class="btn">Post</button></form></div>`:''}</div></div>`).join('')||'<p class="muted glass" style="padding:24px;text-align:center">No ideas here yet. Be the first to post one.</p>'}</div></div>`}

function teamHTML(){const adm=ge(as,'admin'),own=as==='owner',opts=(own?['admin','editor','viewer']:['editor','viewer']);
 const rows=[{id:'me',name:(user()||{}).name||'You',email:(user()||{}).email,role:'owner',self:true},...S.team].map(m=>{const lock=m.role==='owner'||(m.role==='admin'&&!own)||!adm;
  return `<div class="row sp"><div><b>${esc(m.name)}</b>${m.self?'<span class="muted"> (you)</span>':''}${adm&&m.email?`<div class="muted" style="font-size:13px">${esc(m.email)}</div>`:''}</div><div class="row">${lock?`<span class="chip ${m.role==='owner'?'owner':''}">${RL[m.role]}</span>`:`<select class="in" style="width:120px" data-role="${m.id}" aria-label="Role for ${esc(m.name)}">${opts.map(r=>`<option value="${r}" ${r===m.role?'selected':''}>${RL[r]}</option>`).join('')}</select>`}${!lock&&m.role!=='owner'?`<button class="btn g" data-a="rm" data-id="${m.id}">Remove</button>`:''}</div></div>`}).join('');
 return `<div class="glass" style="padding:20px;display:grid;gap:14px"><div><b>Team</b><p class="muted" style="margin:4px 0 0;font-size:14px">Viewers read. Editors triage and reply. Admins also delete ideas and manage people. The owner also manages admins and deletes the project. Use "Viewing as" above to see each role.</p></div>${rows}${adm?`<form data-f="team" class="row" style="border-top:1px solid var(--line);padding-top:14px"><input class="in" name="e" type="email" style="flex:1;min-width:200px" placeholder="Teammate's email" required><select class="in" name="r" style="width:120px" aria-label="Role">${opts.map(r=>`<option value="${r}" ${r==='editor'?'selected':''}>${RL[r]}</option>`).join('')}</select><button class="btn">Add person</button></form>`:'<p class="muted" style="margin:0;font-size:14px">Only admins and the owner can manage the team.</p>'}${F.team?`<p class="err" role="alert">${F.team}</p>`:''}</div>`}

function dashHTML(){const P=S.posts,by=k=>P.filter(p=>p.status===k),ed=ge(as,'editor'),dl=ge(as,'admin');
 const head=`<div class="row sp" style="align-items:flex-end"><div><span class="muted" style="font-size:14px">Owner dashboard</span><h1 class="h1" style="font-size:clamp(28px,5vw,44px)">ResumeDiff <span class="chip ${as==='owner'?'owner':''}" style="font-size:13px;vertical-align:middle">${RL[as]}</span></h1></div><label class="muted" style="font-size:13px">Viewing as (demo) <select class="in" data-as style="width:130px;display:inline-block;margin-left:6px">${Object.keys(RL).reverse().map(r=>`<option value="${r}" ${r===as?'selected':''}>${RL[r]}</option>`).join('')}</select></label></div><div class="row">${[['road','Roadmap'],['stats','Analytics'],['team','Team'],['embed','Share and embed']].map(([k,l])=>`<button class="btn g ${tab===k?'on':''}" data-a="tab" data-id="${k}">${l}</button>`).join('')}</div>`;
 let b='';
 if(tab==='road')b=(ed?'':'<p class="muted" style="margin:0;font-size:14px">You have view-only access to this project.</p>')+`<div class="grid g3">${Object.keys(ST).map(k=>`<div class="glass col"><div class="row sp"><b>${ST[k]}</b><span class="muted">${by(k).length}</span></div>${by(k).sort((a,b)=>b.voters.length-a.voters.length).map(p=>`<div class="glass post" style="display:grid;gap:8px;padding:12px;margin:0;border-radius:14px"><div class="row sp"><b style="font-size:14px">${esc(p.title)}</b><span class="chip">▲ ${p.voters.length}</span></div>${ed?`<select class="in" data-sel="${p.id}" aria-label="Change status">${Object.keys(ST).map(s=>`<option value="${s}" ${s===p.status?'selected':''}>${ST[s]}</option>`).join('')}</select><textarea class="in" rows="2" data-reply="${p.id}" placeholder="Reply to your users">${esc(p.reply)}</textarea>`:(p.reply?`<div class="reply">${esc(p.reply)}</div>`:'')}${dl?`<button class="btn d" data-a="del" data-id="${p.id}">Delete</button>`:''}</div>`).join('')||'<span class="muted" style="font-size:13px">Nothing here yet.</span>'}</div>`).join('')}</div>`;
 if(tab==='stats'){const days=[];for(let i=13;i>=0;i--){const d=new Date(Date.now()-i*D);days.push({k:d.toDateString(),l:d.getDate(),c:0})}P.forEach(p=>{const x=days.find(d=>d.k===new Date(p.createdAt).toDateString());if(x)x.c++});const mx=Math.max(1,...days.map(d=>d.c));
  b=`<div class="grid"><div class="grid g3" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${[['Ideas',P.length],['Votes',P.reduce((a,p)=>a+p.voters.length,0)],['Planned',by('planned').length+by('progress').length],['Shipped',by('shipped').length]].map(([l,v])=>`<div class="glass" style="padding:18px"><div class="muted" style="font-size:14px">${l}</div><div style="font-size:40px;font-weight:300;text-shadow:0 0 30px var(--accent)">${v}</div></div>`).join('')}</div><div class="glass" style="padding:18px"><b>New ideas, last 14 days</b><div class="row" style="flex-wrap:nowrap;align-items:flex-end;height:120px;margin-top:14px;gap:4px">${days.map(d=>`<div style="flex:1;display:grid;justify-items:center;align-content:end;height:100%;gap:4px" title="${d.c}"><div class="bar" style="height:${d.c/mx*100}%"></div><span class="muted" style="font-size:10px">${d.l}</span></div>`).join('')}</div></div><div class="glass" style="padding:18px;display:grid;gap:8px"><b>Top requests</b>${sorted().slice(0,5).map(p=>`<div class="row sp"><span>${esc(p.title)}</span><span class="muted">▲ ${p.voters.length}</span></div>`).join('')}</div></div>`}
 if(tab==='team')b=teamHTML();
 if(tab==='embed')b=`<div class="glass" style="padding:20px;display:grid;gap:14px"><div><b>Feedback widget</b><p class="muted" style="margin:6px 0 8px;font-size:14px">In the real app you paste this tag into your site. Try the Feedback button at the bottom right of this page.</p><code>&lt;script src="https://your-app.vercel.app/widget.js" data-project="resumediff" defer&gt;&lt;/script&gt;</code></div><div class="row"><button class="btn g" data-a="reset">Reset demo data</button>${as==='owner'?'<span class="muted" style="font-size:13px">Only the owner sees "Delete project" in the real app.</span>':''}</div></div>`;
 return `<div class="grid" style="gap:18px">${head}${b}</div>`}

function logHTML(){const L=S.posts.filter(p=>p.status==='shipped').sort((a,b)=>(b.shippedAt||0)-(a.shippedAt||0));
 return `<div style="max-width:760px;margin:0 auto"><h1 class="h1" style="font-size:clamp(28px,5vw,44px);margin-bottom:24px">ResumeDiff changelog</h1>${L.map(p=>`<article class="glass lift" style="padding:20px;margin-bottom:16px"><span class="chip shipped">${fd(p.shippedAt||Date.now())}</span><h2 style="margin:10px 0 6px;font-size:20px;font-weight:600">${esc(p.title)}</h2>${p.body?`<p class="muted" style="margin:0">${esc(p.body)}</p>`:''}${p.reply?`<div class="reply">${esc(p.reply)}</div>`:''}</article>`).join('')||'<p class="muted glass" style="padding:24px">Nothing has shipped yet.</p>'}</div>`}

const STEPS=[['Users post and vote','Share one link, or add the widget to your site. Anyone can post an idea or upvote without making an account.'],['You pick what to build','Your dashboard ranks ideas by votes. Move each one to Planned or In progress and reply to the people who asked.'],['Shipping tells everyone','Mark an idea Shipped and it appears on your public changelog.']];
const FEAT=[['Public feedback board','A clean page where users post, vote and comment.'],['Roadmap you control','Under review, Planned, In progress, Shipped. Change status from a dropdown.'],['Automatic changelog','Shipped ideas become dated release notes.'],['Embeddable widget','One script tag adds a Feedback button to any website.'],['Analytics','Ideas, votes, 14 days of activity and top requests.'],['Team access','Invite collaborators as viewers, editors or admins.']];
const SEC=['Passwords are hashed and never stored in plain text.','Sessions use httpOnly cookies that scripts cannot read.','Accounts lock for 15 minutes after repeated wrong passwords.','Change your password or sign out of all devices at any time.','Every dashboard action is checked against your role on the server.'];
const FAQ=[['Do my users need an account?','No. Visitors can post, vote and comment without signing up. Only you and your team need accounts.'],['Who can see my dashboard?','Only people you add to the project. The public board and changelog are the only public pages.'],['Is it free?','Beacon is open source. Run your own copy on the free tiers of Vercel and MongoDB Atlas.'],['Can I add a teammate?','Yes. Add anyone with a Beacon account by email and choose their role.']];
function homeHTML(){const cta=user()?'<button class="btn" data-a="view" data-id="dash">Open your dashboard</button>':'<button class="btn" data-a="view" data-id="signup">Create your free board</button><button class="btn g" data-a="view" data-id="login">Log in</button>';
 return `<section class="hero"><div style="flex:1.2;min-width:280px"><h1 class="h1">Hear what your users want. Build it. Tell them it shipped.</h1><p class="muted" style="font-size:19px;max-width:540px;margin:20px 0 28px;line-height:1.5">Beacon gives every project a feedback board, a roadmap and a changelog. Built for developers who work alone or in a small team.</p><div class="row">${cta}</div></div>
 <div style="flex:1;display:flex;justify-content:center;min-width:280px"><div class="glass" style="padding:18px;display:grid;gap:10px;max-width:460px;width:100%"><b>ResumeDiff feedback</b>${[['Dark mode for the diff viewer',42,'In progress'],['Export the comparison as PDF',31,'Planned'],['Compare more than two versions',24,'Under review']].map(r=>`<div class="row" style="padding:10px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);flex-wrap:nowrap"><div class="vote on" style="min-width:48px;cursor:default"><span>▲</span><b class="mv">${r[1]}</b></div><div><div style="font-size:15px">${r[0]}</div><span class="chip">${r[2]}</span></div></div>`).join('')}</div></div></section>
 <section class="sec"><h2 class="h2">How it works</h2><div class="grid g3">${STEPS.map((s,i)=>`<div class="glass lift" style="padding:22px"><span class="chip">Step ${i+1}</span><h3 style="margin:12px 0 8px;font-weight:600;font-size:20px">${s[0]}</h3><p class="muted" style="margin:0;line-height:1.55">${s[1]}</p></div>`).join('')}</div></section>
 <section class="sec"><h2 class="h2">Everything in one place</h2><div class="grid g3">${FEAT.map(s=>`<div class="glass lift" style="padding:22px"><h3 style="margin:0 0 8px;font-weight:600;font-size:18px">${s[0]}</h3><p class="muted" style="margin:0;line-height:1.55">${s[1]}</p></div>`).join('')}</div></section>
 <section class="sec"><h2 class="h2">Accounts, teams and security</h2><div class="grid g2"><div class="glass" style="padding:22px;display:grid;gap:10px"><h3 style="margin:0 0 4px;font-weight:600;font-size:18px">What each role can do</h3>${[['Viewer','Read the dashboard and analytics'],['Editor','Also change status, reply and comment as the team'],['Admin','Also delete ideas and manage editors and viewers'],['Owner','Also manage admins and delete the project']].map(r=>`<div class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="chip planned" style="min-width:64px;text-align:center">${r[0]}</span><span class="muted">${r[1]}</span></div>`).join('')}</div><div class="glass" style="padding:22px"><h3 style="margin:0 0 14px;font-weight:600;font-size:18px">How your account is protected</h3><ul class="muted" style="margin:0;padding-left:18px;display:grid;gap:8px;line-height:1.5">${SEC.map(s=>`<li>${s}</li>`).join('')}</ul></div></div></section>
 <section class="sec" style="max-width:760px"><h2 class="h2">Questions</h2>${FAQ.map(q=>`<details class="glass faq"><summary>${q[0]}</summary><p class="muted" style="margin:10px 0 0;line-height:1.55">${q[1]}</p></details>`).join('')}</section>
 <section class="sec glass" style="padding:44px 24px;text-align:center"><h2 class="h2" style="margin-bottom:10px">Start listening to your users today</h2><p class="muted" style="margin:0 0 22px">Create an account, add a project, and share your board link in a minute.</p><div class="row" style="justify-content:center">${user()?'<button class="btn" data-a="view" data-id="dash">Open your dashboard</button>':'<button class="btn" data-a="view" data-id="signup">Create your account</button>'}</div></section>`}

function authHTML(m){const su=m==='signup';
 return `<form data-f="${m}" class="glass auth"><h1 style="margin:0;font-weight:300;font-size:30px;text-shadow:0 0 30px var(--accent)">${su?'Create your account':'Welcome back'}</h1><p class="muted" style="margin:0;font-size:14px">${su?'Free forever. No card needed.':'Log in to manage your boards.'}</p>${F.note?`<p class="muted" style="margin:0;font-size:14px">${F.note}</p>`:''}${su?'<input class="in" name="n" placeholder="Your name" required autocomplete="name">':''}<input class="in" name="e" type="email" placeholder="Email" required autocomplete="email"><div style="position:relative"><input class="in" name="p" type="password" placeholder="Password" required data-pw="${su?1:0}" style="padding-right:64px"><button type="button" class="pwb" data-a="show">Show</button></div>${su?'<div aria-live="polite"><div class="meter"><span></span><span></span><span></span><span></span></div><span class="muted mt" style="font-size:13px">Use 8+ characters with a letter and a number.</span></div>':''}${F.err?`<p class="err" role="alert">${F.err}</p>`:''}<button class="btn">${su?'Create account':'Log in'}</button><p class="muted" style="margin:0;font-size:14px">${su?'Already have an account? ':'New to Beacon? '}<a href="#" data-a="view" data-id="${su?'login':'signup'}" style="color:var(--accent)">${su?'Log in':'Sign up'}</a></p></form>`}

function acctHTML(){const u=user();if(!u)return'';const box=(t,body)=>`<div class="glass" style="padding:20px;display:grid;gap:10px"><b>${t}</b>${body}</div>`,m=k=>F[k]?`<p class="${F[k][0]==='!'?'err':'muted'}" style="margin:0;font-size:14px" role="status">${esc(F[k].replace(/^!/,''))}</p>`:'';
 return `<div style="max-width:640px;margin:0 auto"><h1 class="h1" style="font-size:clamp(30px,5vw,44px)">Your account</h1><p class="muted">${esc(u.email)}</p><div class="grid" style="margin-top:20px;gap:16px">
 <form data-f="name">${box('Profile',`<input class="in" name="n" value="${esc(u.name)}" aria-label="Name" required>${m('name')}<button class="btn" style="justify-self:start">Save name</button>`)}</form>
 <form data-f="pw">${box('Change password',`<input class="in" name="c" type="password" placeholder="Current password" required><input class="in" name="x" type="password" placeholder="New password (8+ characters, a letter and a number)" required>${m('pw')}<button class="btn" style="justify-self:start">Change password</button>`)}</form>
 ${box('Sessions',`<p class="muted" style="margin:0;font-size:14px">Lost a device or used a shared computer? Sign out everywhere except here.</p>${m('ses')}<button class="btn g" style="justify-self:start" data-a="others">Sign out of other devices</button>`)}
 <form data-f="del">${box('Delete account',`<p class="muted" style="margin:0;font-size:14px">This permanently deletes your account and the demo data tied to it.</p><input class="in" name="p" type="password" placeholder="Enter your password to confirm" required>${m('del')}<button class="btn d" style="justify-self:start">Delete my account</button>`)}</form></div></div>`}

function render(){if((view==='dash'||view==='acct')&&!user()){next=view;view='login';F={note:'Log in to continue.'}}const u=user(),v={home:homeHTML,login:()=>authHTML('login'),signup:()=>authHTML('signup'),board:()=>`<div style="max-width:760px;margin:0 auto">${boardHTML(false)}</div>`,dash:dashHTML,log:logHTML,acct:acctHTML}[view];
 const nb=(k,l)=>`<button class="btn g ${view===k?'on':''}" data-a="view" data-id="${k}">${l}</button>`;
 $('#root').innerHTML=`<div class="glass demo">Demo mode: accounts and data live in your browser only. The downloadable project uses real accounts and MongoDB.</div><header class="nav glass"><button class="brand" data-a="view" data-id="home">BEACON</button><nav class="row">${nb('board','Public board')}${nb('log','Changelog')}${u?nb('dash','Dashboard')+nb('acct',esc(u.name.split(' ')[0]))+'<button class="btn g" data-a="out">Log out</button>':nb('login','Log in')+'<button class="btn" data-a="view" data-id="signup">Start free</button>'}</nav></header><main class="wrap">${v()}</main><div id="wp" class="glass ${wOpen?'show':''}">${wOpen?boardHTML(true):''}</div><button id="wb" class="glass btn g" data-a="widget" aria-label="Give feedback">Feedback</button>`}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;e.preventDefault();const a=t.dataset.a,id=t.dataset.id,p=S.posts.find(x=>x.id===id);
 if(a==='show'){const i=t.previousElementSibling;i.type=i.type==='password'?'text':'password';t.textContent=i.type==='password'?'Show':'Hide';return}
 if(a==='view'){if((id==='dash'||id==='acct')&&!S.session){next=id;go('login',{note:'Log in to continue.'})}else go(id)}
 else if(a==='tab')tab=id;else if(a==='flt')flt=id;else if(a==='widget')wOpen=!wOpen;else if(a==='cm')openC=openC===id?null:id;
 else if(a==='out'){S.session=null;save();go('home')}
 else if(a==='others')F.ses='Signed out of all other devices.';
 else if(a==='vote'&&p){const i=p.voters.indexOf(me);i>-1?p.voters.splice(i,1):p.voters.push(me);save()}
 else if(a==='del'&&p){if(!confirm('Delete this idea?'))return;S.posts=S.posts.filter(x=>x.id!==id);save()}
 else if(a==='rm'){const m=S.team.find(x=>x.id===id);if(m&&(m.role!=='admin'||as==='owner')&&ge(as,'admin')){S.team=S.team.filter(x=>x.id!==id);save()}}
 else if(a==='reset'){if(!confirm('Reset all demo data (including accounts)?'))return;S={posts:seed(),users:[],session:null,team:seedTeam()};save();go('home')}
 render()});
document.addEventListener('submit',async e=>{const f=e.target.closest('[data-f]');if(!f)return;e.preventDefault();const k=f.dataset.f,g=n=>(f.elements[n]?f.elements[n].value:'').trim(),raw=n=>f.elements[n]?f.elements[n].value:'';
 const okpw=p=>p.length>=8&&/[A-Za-z]/.test(p)&&/\d/.test(p);F={};
 if(k==='post'){S.posts.push({id:'p'+Date.now(),title:g('t'),body:g('b'),author:g('a')||'Anonymous',status:'open',voters:[me],reply:'',createdAt:Date.now(),shippedAt:null,comments:[]});F.post='Thanks! Your idea is on the board.'}
 else if(k==='cm'){const p=S.posts.find(x=>x.id===f.dataset.id);if(p)p.comments.push({a:'Visitor',t:g('t')})}
 else if(k==='signup'){const em=g('e').toLowerCase();if(!okpw(raw('p'))){F.err='Password needs 8+ characters with a letter and a number.'}else if(S.users.some(u=>u.email===em)){F.err='That email is already registered. Log in instead.'}else{S.users.push({name:g('n'),email:em,h:await H(raw('p'))});S.session=em;save();return go(next==='acct'?'acct':'dash'),render()}}
 else if(k==='login'){const em=g('e').toLowerCase(),u=S.users.find(x=>x.email===em);if(fails>=8)F.err='Too many wrong passwords. Try again in 15 minutes.';else if(!u||u.h!==await H(raw('p'))){fails++;F.err='Email or password is wrong.'}else{fails=0;S.session=em;save();return go(next==='acct'?'acct':'dash'),render()}}
 else if(k==='name'){user().name=g('n');save();F.name='Name updated.'}
 else if(k==='pw'){if(user().h!==await H(raw('c')))F.pw='!Your current password is wrong.';else if(!okpw(raw('x')))F.pw='!New password needs 8+ characters with a letter and a number.';else{user().h=await H(raw('x'));save();F.pw='Password changed. Other devices were signed out.'}}
 else if(k==='del'){if(user().h!==await H(raw('p')))F.del='!That password is wrong.';else if(confirm('Delete your account? This cannot be undone.')){S.users=S.users.filter(u=>u.email!==S.session);S.session=null;save();return go('home'),render()}}
 else if(k==='team'){const em=g('e').toLowerCase(),r=raw('r');if(!ge(as,'admin'))F.team='Only admins can add people.';else if(r==='admin'&&as!=='owner')F.team='Only the owner can add admins.';else if(S.team.some(m=>m.email===em)||(user()&&user().email===em))F.team='That person already has access.';else{S.team.push({id:'t'+Date.now(),name:em.split('@')[0],email:em,role:r});save()}}
 render()});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.as!==undefined){as=e.target.value;F={};return render()}
 if(d.sel){const p=S.posts.find(x=>x.id===d.sel);if(p&&ge(as,'editor')){p.status=e.target.value;p.shippedAt=p.status==='shipped'?Date.now():null;save()}}
 else if(d.role){const m=S.team.find(x=>x.id===d.role),r=e.target.value;F={};if(m&&ge(as,'admin')){if((m.role==='admin'||r==='admin')&&as!=='owner')F.team='Only the owner can change admin access.';else{m.role=r;save()}}}else return;render()});
document.addEventListener('input',e=>{if(e.target.dataset.pw!=='1')return;const s=strength(e.target.value),f=e.target.closest('form'),sp=f.querySelectorAll('.meter span');sp.forEach((x,i)=>x.className=s.s>i?'s'+s.s:'');f.querySelector('.mt').textContent=(e.target.value?s.l+'. ':'')+'Use 8+ characters with a letter and a number.'});
document.addEventListener('focusout',e=>{const r=e.target.dataset&&e.target.dataset.reply;if(!r)return;const p=S.posts.find(x=>x.id===r);if(p&&ge(as,'editor')&&p.reply!==e.target.value){p.reply=e.target.value;save()}});
addEventListener('pointermove',e=>{const r=document.documentElement.style;r.setProperty('--mx',e.clientX+'px');r.setProperty('--my',e.clientY+'px')});
setInterval(()=>{if(view!=='home')return;const l=document.querySelectorAll('.mv');if(l.length){const x=l[Math.floor(Math.random()*l.length)];x.textContent=+x.textContent+1}},1800);
render();
</script>
</body>
</html>
